name: Workspace Coverage

# Reusable workflow: called from the push pipelines (`on-pr-quality.yaml` on
# push to v5, `on-push-main-version-and-tag.yaml` on push to main). It runs on
# pushes only: an instrumented build roughly doubles the services job, and in
# a called workflow `github.event_name` is the caller's event, so pull
# requests, merge groups and manual runs skip it. Release tagging does not
# wait on it.
#
# `make coverage-local` runs the same nextest suite as `make test-local`
# against the compose services, under cargo-llvm-cov, and prints one line
# coverage number for the workspace's production code: per crate and TOTAL.
# Test files are excluded by the footprint classifier
# (scripts/coverage/ignore_regex.py); inline `#[cfg(test)]` blocks still
# count and doctests do not run (docs/guides/testing.md, "Coverage Reporting").
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  coverage:
    name: Workspace Coverage (all features, real services)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # Not yet measured: set from the first runs' cold-cache time, then lower.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: rust-src, llvm-tools-preview
      # An instrumented build shares nothing with `workspace-services`.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-coverage
          save-if: ${{ github.event_name != 'pull_request' }}
      # --all-features compiles rdkafka; librdkafka's bundled cmake build needs
      # curl/curl.h (the runner has libcurl's runtime but not its headers).
      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest@0.9.140,cargo-llvm-cov@0.9.1
      - name: Measure the workspace against compose services
        run: make coverage-local CARGO_TEST_ARGS="--workspace --all-features"
        env:
          # No fail-fast, JUnit at target/nextest/ci/junit.xml.
          NEXTEST_PROFILE: ci
      - name: Write the coverage summary
        run: python3 -B scripts/coverage/summary.py target/coverage/summary.json --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lcov.info
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-coverage-lcov
          path: target/coverage/lcov.info
      - name: Upload the JUnit report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-coverage-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
