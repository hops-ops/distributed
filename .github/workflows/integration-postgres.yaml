name: Postgres Integration Tests

# Reusable workflow: referenced via `uses: ./.github/workflows/integration-postgres.yaml`
# from both the PR-quality and push-to-main pipelines.
on:
  workflow_call:

jobs:
  postgres:
    name: Postgres Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: distributed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d distributed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/distributed_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: postgres-integration
      - name: Run Postgres integration tests
        run: |
          cargo test --lib --no-default-features --features postgres postgres_command_ledger_adapter_conformance_when_database_available --verbose
          cargo test --test postgres_repository --no-default-features --features postgres --verbose
          cargo test --test postgres_repository_conformance --no-default-features --features postgres --verbose
          cargo test --test postgres_transport --no-default-features --features postgres --verbose
          cargo test --test distributed_read_model --no-default-features --features postgres --verbose
          cargo test --test sql_lock_manager --no-default-features --features postgres --verbose
          cargo test --test graphql_literal_text --no-default-features --features graphql,postgres --verbose
      - name: Verify source fencing and snapshot rebuild against PostgreSQL
        env:
          DISTRIBUTED_SNAPSHOT_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/distributed_snapshots
          DISTRIBUTED_REBUILD_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/distributed_rebuild
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres distributed_snapshots
          docker exec ${{ job.services.postgres.id }} createdb -U postgres distributed_rebuild
          cargo test --lib --no-default-features --features graphql,postgres projection::source_snapshot_tests::source_snapshots_postgres_reordering_and_restart -- --exact
          cargo test --lib --no-default-features --features graphql,postgres projection::source_snapshot_tests::snapshot_rebuild_postgres -- --exact
      - name: Verify unique-key GraphQL joins and authorization
        env:
          DISTRIBUTED_UNIQUE_KEY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/distributed_unique_key_test
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres distributed_unique_key_test
          cargo test --lib --no-default-features --features graphql,postgres graphql::engine::composite_relationship_tests::unique_key_join_postgres_authorization_and_manifest -- --ignored --exact
          cargo test --lib --no-default-features --features postgres sqlx_repo::projection_protocol::reads::candidate_key_snapshot_lookup_postgres -- --ignored --exact
