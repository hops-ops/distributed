name: Diagnose refresh continuity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install isolated browser fixture
        run: |
          cargo install wasm-pack --locked
          npm ci --prefix tests/gateway-auth
          npm ci --prefix tests/e2e-ui
          cd tests/gateway-auth
          npx playwright install --with-deps chromium
      - name: Run production gateway with authority diagnostics
        run: node tests/e2e-ui/gateway/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-application-diagnostics
          path: tests/e2e-ui/gateway/artifacts/
