name: On Version Tagged, Publish Packages and CLI Artifacts

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Fail closed before crates publish if the public npm package is missing.
  release-preflight:
    name: Verify release registries are ready
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag in vX.Y.Z form, got: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Verify npm package exists
        run: |
          package_name="$(npm view @hops-ops/distributed name)"
          if [[ "$package_name" != "@hops-ops/distributed" ]]; then
            echo "Expected @hops-ops/distributed on npm, got: $package_name" >&2
            exit 1
          fi

  publish-macros:
    needs: release-preflight
    uses: unbounded-tech/workflows-rust/.github/workflows/publish.yaml@feat/cargo-publish
    secrets:
      crates_io_token: ${{ secrets.CRATES_IO_TOKEN }}
    with:
      manifest_path: distributed_macros/Cargo.toml
      cargo_publish_args: "--locked"

  # distributed_cli (the `distributed` binary + generation library) has no internal
  # workspace dependencies, so it publishes independently of the macros/core crates.
  publish-cli:
    needs: release-preflight
    uses: unbounded-tech/workflows-rust/.github/workflows/publish.yaml@feat/cargo-publish
    secrets:
      crates_io_token: ${{ secrets.CRATES_IO_TOKEN }}
    with:
      manifest_path: distributed_cli/Cargo.toml
      cargo_publish_args: "--locked"

  publish:
    needs: publish-macros
    uses: unbounded-tech/workflows-rust/.github/workflows/publish.yaml@feat/cargo-publish
    secrets:
      crates_io_token: ${{ secrets.CRATES_IO_TOKEN }}
    with:
      manifest_path: Cargo.toml
      cargo_publish_args: "--locked"

  publish-js:
    name: Publish Distributed JS client to npm
    needs: release-preflight
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # npm trusted publishing requires npm CLI 11.5.1 or newer.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Derive package version from release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected a release tag in vX.Y.Z form, got: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Apply release version to package metadata
        run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Run package quality checks
        run: npm run quality

      - name: Publish package with provenance
        run: npm publish --provenance --access public

  # `publish` waits for the macros crate; the CLI and JS package are independent.
  # Gate binary artifacts on every package publication.
  release:
    needs: [publish, publish-cli, publish-js]
    permissions:
      contents: write
    uses: unbounded-tech/workflows-rust/.github/workflows/release.yaml@v2.3.0
    with:
      binary_name: distributed
      # Cargo.lock is intentionally untracked for this library workspace.
      build_args: "--release --package distributed_cli --bin distributed"
