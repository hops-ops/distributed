name: On Push to Main, Version and Tag For Release

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: write

jobs:
  # Framework monorepo keeps its existing quality provider. Reusable
  # quality.yaml is for Distributed *consumers* (see workflows README).
  quality:
    uses: unbounded-tech/workflows-rust/.github/workflows/quality.yaml@feat/cargo-publish
    with:
      cargo_build_args: "--verbose"
      cargo_test_args: "--verbose"
      cargo_incremental: true

  all-features:
    uses: ./.github/workflows/test-all-features.yaml

  postgres:
    uses: ./.github/workflows/integration-postgres.yaml

  nats:
    uses: ./.github/workflows/integration-nats.yaml

  rabbitmq:
    uses: ./.github/workflows/integration-rabbitmq.yaml

  kafka:
    uses: ./.github/workflows/integration-kafka.yaml

  distributed-cli:
    uses: ./.github/workflows/integration-distributed-cli.yaml

  observability:
    uses: ./.github/workflows/integration-observability.yaml

  graphql:
    uses: ./.github/workflows/integration-graphql.yaml

  e2e-ui:
    uses: ./.github/workflows/integration-e2e-ui.yaml

  js-client:
    uses: ./.github/workflows/integration-js.yaml

  celld:
    uses: ./.github/workflows/integration-celld.yaml

  # This uses commit logs and tags from git to determine the next version number and create a tag for the release.
  # Some commits such as chore: will not trigger a version bump and tag; this is by design.
  version-and-tag:
    name: Version and Tag
    needs: [quality, all-features, postgres, nats, rabbitmq, kafka, distributed-cli, observability, graphql, e2e-ui, js-client, celld]
    uses: unbounded-tech/workflow-vnext-tag/.github/workflows/workflow.yaml@v1.22.3
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    with:
      useDeployKey: true
      rust: true
