name: GraphQL Identity / OIDC Integration Tests

# Reusable workflow: wired from on-pr-quality and on-push-main.
#
# - identity-always-on: mock JWKS F1–F10 (no IdP)
# - oidc-zitadel-e2e: live Zitadel compose + JWT-bearer mint
# - oidc-keycloak-e2e: live Keycloak compose + client_credentials
# - oidc-authentik-e2e: live Authentik compose + client_credentials
#
# Local parity:
#   ./scripts/oidc-{zitadel,keycloak,authentik}-up.sh
#   set -a && source graphql-oidc[-keycloak|-authentik].env && set +a
#   cargo test --test graphql --features graphql,sqlite,metrics graphql_oidc_<provider>:: -- --ignored
#
# Each provider's test is `#[ignore = "live: ..."]` (ignored in make
# test-local) and fails without OIDC_ISSUER. scripts/expect-tests-passed.sh
# fails a step unless exactly one test passed.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # File and line in backtraces, without the full debug info that makes up
  # most of a dev build's link time and cache size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  identity-always-on:
    name: GraphQL Identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: graphql
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Always-on identity suite (no IdP)
        run: |
          cargo test --test graphql --features graphql,sqlite,metrics --verbose graphql_identity::

  oidc-zitadel-e2e:
    name: GraphQL OIDC Zitadel e2e (live)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZITADEL_HOST: http://localhost:8080
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: graphql
          save-if: false
      - name: Install bootstrap tools
        run: sudo apt-get update && sudo apt-get install -y jq openssl curl
      - name: Start Zitadel + bootstrap (docker compose)
        run: |
          chmod +x scripts/oidc-zitadel-up.sh scripts/ci-bootstrap-graphql-oidc.sh
          ./scripts/oidc-zitadel-up.sh
      - name: Run live Zitadel e2e suite
        run: |
          set -a
          # shellcheck disable=SC1091
          source graphql-oidc.env
          set +a
          test -n "${OIDC_ISSUER:-}"
          test -n "${GRAPHQL_E2E_CUSTOMER_KEY:-}"
          echo "OIDC_ISSUER=$OIDC_ISSUER"
          scripts/expect-tests-passed.sh 1 cargo test --test graphql --features graphql,sqlite,metrics --verbose graphql_oidc_zitadel:: -- --ignored --nocapture
      - name: Dump Zitadel logs on failure
        if: failure()
        run: |
          docker compose -f tests/graphql/graphql_oidc_zitadel/docker-compose.yml ps -a || true
          docker compose -f tests/graphql/graphql_oidc_zitadel/docker-compose.yml logs --tail=200 || true
          ls -la tests/graphql/graphql_oidc_zitadel/machinekey || true
      - name: Tear down
        if: always()
        run: docker compose -f tests/graphql/graphql_oidc_zitadel/docker-compose.yml down -v || true

  oidc-keycloak-e2e:
    name: GraphQL OIDC Keycloak e2e (live)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: graphql
          save-if: false
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl python3
      - name: Start Keycloak + bootstrap
        run: |
          chmod +x scripts/oidc-keycloak-up.sh
          ./scripts/oidc-keycloak-up.sh
      - name: Run live Keycloak e2e suite
        run: |
          set -a
          # shellcheck disable=SC1091
          source graphql-oidc-keycloak.env
          set +a
          test -n "${OIDC_ISSUER:-}"
          echo "OIDC_ISSUER=$OIDC_ISSUER OIDC_AUDIENCE=$OIDC_AUDIENCE"
          scripts/expect-tests-passed.sh 1 cargo test --test graphql --features graphql,sqlite,metrics --verbose graphql_oidc_keycloak:: -- --ignored --nocapture
      - name: Dump Keycloak logs on failure
        if: failure()
        run: |
          docker compose -f tests/graphql/graphql_oidc_keycloak/docker-compose.yml ps -a || true
          docker compose -f tests/graphql/graphql_oidc_keycloak/docker-compose.yml logs --tail=200 || true
      - name: Tear down
        if: always()
        run: docker compose -f tests/graphql/graphql_oidc_keycloak/docker-compose.yml down -v || true

  oidc-authentik-e2e:
    name: GraphQL OIDC Authentik e2e (live)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: graphql
          save-if: false
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl python3
      - name: Start Authentik + bootstrap
        run: |
          chmod +x scripts/oidc-authentik-up.sh
          ./scripts/oidc-authentik-up.sh
      - name: Run live Authentik e2e suite
        run: |
          set -a
          # shellcheck disable=SC1091
          source graphql-oidc-authentik.env
          set +a
          test -n "${OIDC_ISSUER:-}"
          test -n "${OIDC_JWKS_URI:-}"
          echo "OIDC_ISSUER=$OIDC_ISSUER"
          scripts/expect-tests-passed.sh 1 cargo test --test graphql --features graphql,sqlite,metrics --verbose graphql_oidc_authentik:: -- --ignored --nocapture
      - name: Dump Authentik logs on failure
        if: failure()
        run: |
          docker compose -f tests/graphql/graphql_oidc_authentik/docker-compose.yml ps -a || true
          docker compose -f tests/graphql/graphql_oidc_authentik/docker-compose.yml logs --tail=200 || true
      - name: Tear down
        if: always()
        run: docker compose -f tests/graphql/graphql_oidc_authentik/docker-compose.yml down -v || true
