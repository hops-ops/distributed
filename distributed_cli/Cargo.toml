[package]
name = "distributed_cli"
description = "The `distributed` CLI for Distributed applications: build and dev lifecycle, scaffold projects, describe manifests, compile clients, and render schema artifacts. Also a library so other CLIs (e.g. hops) can mount its commands."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "distributed"
path = "src/main.rs"

[dependencies]
async-graphql-parser = "7"
async-graphql-value = "7"
base64 = "0.23.0"
clap = { version = "4", features = ["derive"] }
# `termination` adds SIGTERM and SIGHUP to the SIGINT handler.
ctrlc = { version = "3", features = ["termination"] }
distributed = { path = "..", default-features = false }
distributed_game = { path = "../distributed_game" }
# The client manifest's `leaderboards` section (`leaderboards.ts`).
distributed_leaderboard = { path = "../distributed_leaderboard" }
dotenvy = "0.15"
fs2 = "0.4"
glob = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
