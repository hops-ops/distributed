# Copied by tests/bats/lifecycle.bats, which replaces __DISTRIBUTED_ROOT__ with
# the checkout under test. A service and a GraphQL surface with no lifecycle
# configuration: `distributed build` and `dev` must discover everything.
[package]
name = "zero-config-app"
version = "0.1.0"
edition = "2021"

[workspace]

[package.metadata.distributed.application]
entrypoint = "application_manifest"

[package.metadata.distributed.runtime]
binary = "zero-config-app"

[dependencies]
distributed = { path = "__DISTRIBUTED_ROOT__", features = ["http", "sqlite", "graphql"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

