[workspace]
members = ["."]
resolver = "2"

[package]
name = "fact-cell-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "workers-rs cells for zone facts sent over the network by CelldFactSink (Kills, Match, Presence)"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
distributed = { path = "../../..", default-features = false, features = ["workers-rs"] }
distributed_game = { path = "../../../distributed_game", default-features = false, features = ["cell", "workers-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8", features = ["queue"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
