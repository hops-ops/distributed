# A test zone hosted as celld Durable Objects (`distributed_game`'s
# `celld-zone` feature) with the cells its facts go to. Used by
# `distributed_game/tests/celld_zone` (single node and a multi-node fleet).
[workspace]
members = ["."]
resolver = "2"

[package]
name = "celld-zone-test-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "workers-rs: a tally zone as a celld Durable Object, its Tally and ZoneActivity cells"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
distributed = { path = "../../..", default-features = false, features = ["workers-rs"] }
distributed_game = { path = "../../../distributed_game", default-features = false, features = ["celld-zone"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8", features = ["queue"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
