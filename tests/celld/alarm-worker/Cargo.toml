[workspace]
members = ["."]
resolver = "2"

[package]
name = "ticker-cell-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "workers-rs Ticker cell: re-armable cell alarms sharing the Durable Object alarm with the outbox watchdog"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
distributed = { path = "../../..", default-features = false, features = ["workers-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8", features = ["queue"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
