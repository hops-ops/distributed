[workspace]
members = ["."]
resolver = "2"

[package]
name = "todo-cell-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "workers-rs Todo and Chat cells: AggregateCell + domain handles"

[lib]
crate-type = ["cdylib"]

[features]
# Only the isolated crash/rollback harness builds these authenticated probes.
storage-conformance = []

[dependencies]
console_error_panic_hook = "0.1"
distributed = { path = "../../..", default-features = false, features = ["workers-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
todo-domain = { path = "../../e2e-ui/crates/todo-domain" }
chat-domain = { path = "../../e2e-ui/crates/chat-domain" }
worker = { version = "0.8", features = ["queue"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
