# The e2e-ui application on another command host: one runner crate over
# e2e-ui's `e2e-service`. Todo and Chat commands wait-dispatch to celld cells;
# the cells' outbox drains onto NATS; @live and Eventual projectors stay here.
[workspace]
resolver = "2"
members = ["crates/runner"]

[workspace.metadata.distributed.application]
package = "e2e-celld-runner"
entrypoint = "application_manifest"

[workspace.metadata.distributed.runtime]
package = "e2e-celld-runner"
binary = "e2e-celld"

# This application intentionally owns a UI outside its Cargo workspace. The
# lifecycle resolves and validates the path; no JSON process graph is needed.
[workspace.metadata.distributed.ui]
path = "../e2e-ui/ui"

# The same UI as tests/e2e-ui, so the same development environment.
[workspace.metadata.distributed.ui.env]
E2E_API_ORIGIN = "{api_url}"
AUTH_URL = "{ui_url}"
AUTH_USE_SECURE_COOKIES = "false"
AUTH_SECRET = "distributed-local-development-only-secret"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
distributed = { path = "../..", features = ["sqlite", "postgres", "http", "graphql", "gateway-graphql-native", "metrics", "nats"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = "0.8"
