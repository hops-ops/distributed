[package]
name = "gateway-native-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["gateway-native"]
gateway-native = ["distributed/gateway-native"]

[dependencies]
distributed = { path = "../..", default-features = false }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"

[[test]]
name = "gateway_ui"
path = "../gateway_ui.rs"
