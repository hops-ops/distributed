apiVersion: hops.local/v1alpha1
kind: Environment
metadata:
  # Template name. The runtime name defaults to the checkout directory
  # (`e2e-ui`) and names the namespace and the OIDC workspace; CI and the
  # README pass `--name local` (namespace `local`, `e2e-ui-local-*`).
  name: local
spec:
  clusterRef:
    name: e2e-ui
  # Resolved from the checkout that holds .gitops/local (tests/e2e-ui).
  root: .
  values:
    local: true
    preview: false
  deploys:
    # Every path is an explicit renderer directory; no chart is inferred.
    - path: api/.gitops/local
      type: helm
      values:
        identity:
          enabled: true
          oidcGeneration: 1
    # Test identities are an explicit, independently rendered deploy.
    - path: ui/.gitops/test-users
      type: helm
      values:
        identity:
          enabled: true
          oidcGeneration: 1
          projectName: e2e-ui
          projectNamespace: default
          humansNamespace: default
          instanceLoginV2: true
          demoUsers: true
          providerConfigRef:
            name: default
            kind: ClusterProviderConfig
