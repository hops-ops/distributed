apiVersion: hops.local/v1alpha1
kind: Application
metadata:
  name: e2e-ui-ui
spec:
  source:
    path: ../../../ui/.gitops/deploy
    helm:
      values:
        local: true
        appRuntime: cluster-dev
        clusterDev:
          sourceGeneration: 1
        # Chart identity MRs: Project/roles/humans + Oidc.
        # - projectIdRef / labels (no live UUIDs)
        # - writeConnectionSecretToRef for client id/secret
        # - orgId omitted (ProviderConfig PAT org)
        identity:
          enabled: true
          # Declarative client-secret rotation; bump and let prune replace OIDC.
          oidcGeneration: 1
          projectName: e2e-ui
          projectNamespace: default
          humansNamespace: default
          # App-level OIDC loginVersion.baseUri is per namespace. Instance
          # Features are global; only one primary lane may set this true.
          instanceLoginV2: false
          demoUsers: true
          providerConfigRef:
            name: default
            kind: ClusterProviderConfig
  syncPolicy:
    prune: true
