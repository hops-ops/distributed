apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "e2e-ui-api.name" . }}
  labels:
    {{- include "e2e-ui-api.labels" . | nindent 4 }}
    hops.ops.com.ai/runtime: cluster-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "e2e-ui-api.name" . }}
  template:
    metadata:
      {{- if .Values.identity.enabled }}
      annotations:
        hops.ops.com.ai/oidc-generation: {{ .Values.identity.oidcGeneration | default 0 | quote }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "e2e-ui-api.name" . }}
        hops.ops.com.ai/runtime: cluster-dev
    spec:
      initContainers:
        - name: node-toolchain
          image: {{ .Values.clusterDev.nodeImage | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              mkdir -p /toolchain/bin /toolchain/lib/node_modules
              cp -a /usr/local/bin/. /toolchain/bin/
              cp -a /usr/local/lib/node_modules/. /toolchain/lib/node_modules/
          volumeMounts:
            - name: node-toolchain
              mountPath: /toolchain
      containers:
        - name: application
          image: {{ .Values.clusterDev.image | quote }}
          workingDir: {{ .Values.clusterDev.workingDir | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              {{- if eq .Values.sourceDelivery.mode "sync" }}
              echo "waiting for source sync at {{ .Values.sourceDelivery.mountPath }}..."
              waited=0
              while [ ! -f {{ .Values.sourceDelivery.mountPath }}/.hops-synced ] \
                && [ ! -f {{ .Values.clusterDev.workingDir }}/Cargo.toml ]; do
                sleep 2
                waited=$((waited + 2))
                if [ $((waited % 30)) -eq 0 ]; then
                  echo "still waiting for hops source sync (${waited}s) — is source delivery running?"
                fi
                if [ "$waited" -ge 600 ]; then
                  echo "ERROR: source sync timeout after ${waited}s"
                  exit 1
                fi
              done
              {{- end }}
              echo "source present; starting coherent Distributed lifecycle"
              cargo --version
              node --version
              npm --version
              exec cargo run --manifest-path /workspace/Cargo.toml \
                --package distributed_cli --bin distributed -- \
                dev {{ .Values.clusterDev.workingDir }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: api
            - containerPort: {{ .Values.env.UI_PORT | int }}
              name: ui
          env:
            {{- include "e2e-ui-api.oidcClientEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.env }}
            {{- if eq $k "AUTH_URL" }}
            - name: AUTH_URL
              value: {{ printf "http://e2e-ui-ui.%s.svc.cluster.local:5180" (include "e2e-ui-api.releaseNamespace" $) | quote }}
            {{- else if or (eq $k "UI_URL") (eq $k "PUBLIC_ORIGIN") }}
            - name: {{ $k }}
              value: {{ printf "http://e2e-ui-ui.%s.svc.cluster.local:5180" (include "e2e-ui-api.releaseNamespace" $) | quote }}
            {{- else if and $v (ne $v "") }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- $oidcConn := include "e2e-ui-api.oidcConnectionSecretName" . -}}
            {{- range $k, $ref := .Values.secretEnv }}
            {{- if and $.Values.identity.enabled (or (eq $k "OIDC_CLIENT_ID") (eq $k "OIDC_CLIENT_SECRET")) }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $oidcConn | quote }}
                  key: {{ if eq $k "OIDC_CLIENT_ID" }}attribute.client_id{{ else }}attribute.client_secret{{ end }}
            {{- else }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName | quote }}
                  key: {{ $ref.key | quote }}
            {{- end }}
            {{- end }}
            - name: PATH
              value: "/opt/node/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          volumeMounts:
            - name: source
              mountPath: {{ .Values.sourceDelivery.mountPath }}
            - name: cargo-target
              mountPath: {{ .Values.clusterDev.workingDir }}/target
            - name: ui-node-modules
              mountPath: {{ .Values.clusterDev.workingDir }}/ui/node_modules
            - name: js-node-modules
              mountPath: /workspace/js/node_modules
            - name: node-toolchain
              mountPath: /opt/node
      volumes:
        - name: source
          {{- if eq .Values.sourceDelivery.mode "hostPath" }}
          hostPath:
            path: {{ .Values.sourceDelivery.hostPath | quote }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: cargo-target
          emptyDir: {}
        - name: ui-node-modules
          emptyDir: {}
        - name: js-node-modules
          emptyDir: {}
        - name: node-toolchain
          emptyDir: {}
