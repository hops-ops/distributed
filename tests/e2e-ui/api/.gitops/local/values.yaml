local: true
preview: false

environment:
  name: local
  namespace: default

name: e2e-ui-api
clusterDev:
  image: rust:1.94-bookworm
  nodeImage: node:22-bookworm
  workingDir: /workspace/tests/e2e-ui

identity:
  enabled: false
  # Must match the identity.workspace value passed to the UI and test-users
  # charts. Empty means the resolved Environment name.
  workspace: ""
  oidcGeneration: 0
  connectionSecretName: ""

service:
  name: e2e-ui-api
  port: 8791
  targetPort: 8791

uiService:
  name: e2e-ui-ui
  port: 5180
  targetPort: 8791

env:
  CARGO_TARGET_DIR: "/workspace/tests/e2e-ui/target"
  BIND: "0.0.0.0:8791"
  UI_BIND: "0.0.0.0"
  UI_PORT: "5180"
  UI_INTERNAL_ORIGIN: "http://127.0.0.1:5180"
  PUBLIC_ORIGIN: "http://e2e-ui-ui.default.svc.cluster.local:5180"
  UI_URL: "http://e2e-ui-ui.default.svc.cluster.local:5180"
  AUTH_URL: "http://e2e-ui-ui.default.svc.cluster.local:5180"
  AUTH_TRUST_HOST: "true"
  AUTH_USE_SECURE_COOKIES: "false"
  PUBLIC_E2E_API_ORIGIN: "http://e2e-ui-api:8791"
  DATABASE_URL: "sqlite:/tmp/e2e-ui.db?mode=rwc"
  OIDC_ISSUER: "http://zitadel-zitadel.auth.svc.cluster.local:8080"
  OIDC_AUDIENCE: ""
  OIDC_JWKS_URI: "http://zitadel-zitadel.auth.svc.cluster.local:8080/oauth/v2/keys"
  ZITADEL_PROJECT_ID: ""

secretEnv:
  AUTH_SECRET:
    secretName: e2e-ui-oidc
    key: AUTH_SECRET
  OIDC_CLIENT_ID:
    secretName: e2e-ui-oidc
    key: OIDC_CLIENT_ID
  OIDC_CLIENT_SECRET:
    secretName: e2e-ui-oidc
    key: OIDC_CLIENT_SECRET
  ZITADEL_SERVICE_USER_TOKEN:
    secretName: e2e-ui-oidc
    key: ZITADEL_SERVICE_USER_TOKEN

sourceDelivery:
  # Hops local gitops replaces this sentinel with the Cluster mountRoot
  # hostPath before applying the Deployment. The chart is intentionally not a
  # standalone Helm checkout; its command expects the mounted workspace.
  mode: none
  hostPath: ""
  mountPath: /workspace
