[package]
name = "blob-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Blob game domain: pure board core, aggregate, browser WASM preview"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["domain"]
# Aggregate + levels (server / tests / cells).
domain = ["dep:thiserror", "dep:rand"]
# The browser export of `PREVIEW_MOVE` (built by `distributed build`).
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Path + default-features: the pure core and the aggregate build for wasm32
# (browser and cells) without e2e-ui's server features.
distributed = { path = "../../../..", default-features = false }
thiserror = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
