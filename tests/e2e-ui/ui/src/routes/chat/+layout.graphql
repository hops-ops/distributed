# The nested chat layout owns the lobby window across child pages: the newest
# 25 messages stay live, and `@window` pages older ones by keyset cursor.
query ChatMessages($limit: Int! = 25) @load @live @window {
  chat_messages(
    where: { room_id: { _eq: "lobby" } }
    limit: $limit
    order_by: [{ created_at: desc }, { message_id: desc }]
  ) {
    message_id
    room_id
    author_id
    body
    created_at
    author {
      user_id
      display_name
      email
    }
  }
}
