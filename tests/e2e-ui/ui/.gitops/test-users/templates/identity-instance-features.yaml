{{- /* Test-user chart ownership.
  Instance Login V2 features (gitops).

  Zitadel honors instance loginV2.baseUri when required=true. That redirects
  authorize to this UI's /login. The OIDC app already sets loginVersion.baseUri
  per worktree, which is enough for lanes to coexist.

  This resource is instance-global. The chart default is off. One primary
  lane may set identity.instanceLoginV2 true. A second lane must leave it
  false or the last apply replaces the first lane's login host.
*/ -}}
{{- if and .Values.identity.enabled (ne .Values.identity.instanceLoginV2 false) }}
{{- $uiBase := include "e2e-ui-ui.uiBaseURL" . -}}
{{- $ns := include "e2e-ui-ui.releaseNamespace" . -}}
apiVersion: instance.zitadel.m.crossplane.io/v1alpha1
kind: Features
metadata:
  name: e2e-ui-login-v2
  namespace: {{ $ns }}
  labels:
    {{- include "e2e-ui-ui.identityLabels" . | nindent 4 }}
spec:
  forProvider:
    loginV2:
      - required: true
        baseUri: {{ $uiBase | quote }}
  providerConfigRef:
    name: {{ .Values.identity.providerConfigRef.name | default "default" | quote }}
    kind: {{ .Values.identity.providerConfigRef.kind | default "ProviderConfig" | quote }}
{{- end }}
