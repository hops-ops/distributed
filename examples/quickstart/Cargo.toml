[package]
name = "distributed-quickstart"
version = "0.1.0"
edition = "2021"
publish = false
description = "The no-Docker quickstart: one aggregate, command, projection and read model over SQLite"

# A crate of its own: inside the `distributed` package the framework's macros
# expand to `crate::` paths, so an example there cannot use them.
[dependencies]
distributed = { path = "../..", features = ["graphql", "sqlite"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
