# The game demos' durable cells on celld (workers-rs, wasm32): Mob Pit's
# rooms (one Durable Object per room, `distributed_game::celld_zone`) and
# their zone-activity cells, Mob Pit's per-player Crawler aggregate and
# per-player presence
# (with the outbox Queue consumer that relays Crawler domain events to the
# zone server and runs the world tier saga), and the hood / borough / city
# tier cells and the world's content rollout.
# Own workspace (cdylib for wasm32-unknown-unknown); built with
# `worker-build --release` by `examples/game/run.sh`.
[workspace]
members = ["."]
resolver = "2"

[package]
name = "game-demo-cells"
version = "0.1.0"
edition = "2021"
publish = false
description = "Mob Pit on celld: rooms, crawler, presence, tier and content cells (dev demo)"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
distributed = { path = "../../..", default-features = false, features = ["workers-rs"] }
distributed_game = { path = "../../../distributed_game", default-features = false, features = ["cell", "workers-rs", "celld-zone"] }
mobpit_crawler = { path = "../server/crawler" }
# The world tiers (hood, borough, city cells) and their saga steps.
mobpit_tiers = { path = "../server/tiers" }
# Mob Pit's rooms, each one a Durable Object (`PitRoom`).
mobpit_rooms = { path = "../server/rooms", features = ["celld"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8", features = ["queue"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
