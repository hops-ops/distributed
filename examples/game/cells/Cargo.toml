# The game demos' durable cells on celld (workers-rs, wasm32): Mob Pit's
# per-player Crawler aggregate and per-player presence
# (with the outbox Queue consumer that relays Crawler domain events to the
# zone server), and the zone lease and hibernation-state cells every
# multi-host demo uses.
# Own workspace (cdylib for wasm32-unknown-unknown); built with
# `worker-build --release` by `examples/game/run.sh`.
[workspace]
members = ["."]
resolver = "2"

[package]
name = "mobpit-cells"
version = "0.1.0"
edition = "2021"
publish = false
description = "Game demo cells for celld: Mob Pit, zone leases and zone state (dev demo)"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
distributed = { path = "../../..", default-features = false, features = ["workers-rs"] }
distributed_game = { path = "../../../distributed_game", default-features = false, features = ["cell", "workers-rs"] }
mobpit_crawler = { path = "../server/crawler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8", features = ["queue"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
