# The spike's one S3-compatible store (RustFS) for the celld fleet bucket.
# Compose rather than `docker run`: Dory (this machine's Docker) published
# ports only for containers on a user-defined network.
services:
  s3:
    image: rustfs/rustfs:1.0.3
    container_name: zone-do-spike-s3
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_ACCESS_KEY: spikeadmin
      RUSTFS_SECRET_KEY: spikesecret123
    ports: ["127.0.0.1:${S3_PORT:-19400}:9000"]
