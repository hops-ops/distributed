# The CelldStack below composes into this namespace; its Helm releases and
# Objects use these (the provider's own identity, like the machine defaults).
apiVersion: helm.m.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: mobpit
  namespace: mobpit-system
spec:
  credentials:
    source: InjectedIdentity
