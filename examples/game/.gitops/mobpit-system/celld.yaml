# The Mob Pit celld fleet: one node on in-cluster RustFS (bucket s3://celld)
# in namespace mobpit-celld, public listener
# http://celld.mobpit-celld.svc.cluster.local:8080. Each Mob Pit
# Environment deploys the cells worker into it (the last deploy wins).
#
# The celld pods get Istio sidecars, like the Mob Pit pods: the worker's
# outbox relay to a Mob Pit Service is mTLS between them. (kind-hops can't
# run ambient: istio-cni needs IPv6 policy routing, which the Dory kernel
# lacks. RustFS stays out of the mesh.)
apiVersion: hops.ops.com.ai/v1alpha1
kind: CelldStack
metadata:
  name: celld
  namespace: mobpit-system
spec:
  clusterName: mobpit
  namespace: mobpit-celld
  releaseName: celld
  # Probes celld's own /.well-known/celld/health (hops-ops/celld-chart#23);
  # earlier charts probe a path the deployed Worker answers.
  chartVersion: "0.5.1"
  rustfs:
    enabled: true
    credentialsSecretRef:
      name: mobpit-rustfs-credentials
  values:
    podLabels:
      sidecar.istio.io/inject: "true"
    podAnnotations:
      # celld reaches RustFS as it starts.
      proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
