apiVersion: v1
kind: ConfigMap
metadata:
  name: mobpit-relay
  labels:
    {{- include "mobpit.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events {}
    http {
      access_log off;
      server {
        listen 8443 ssl;
        ssl_certificate /etc/relay-tls/tls.crt;
        ssl_certificate_key /etc/relay-tls/tls.key;
        client_max_body_size 16m;
        location = /internal/celld-queue/relay {
          proxy_pass http://127.0.0.1:2567;
        }
        location / {
          return 404;
        }
      }
    }
