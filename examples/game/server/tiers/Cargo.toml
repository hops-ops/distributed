# Mob Pit's world tiers: hood, borough and city aggregates (celld cells in
# examples/game/cells), the boss fact a room emits and the saga steps that
# ripple a hood's change up. Portable (wasm32 cells, native tests).
[package]
name = "mobpit_tiers"
version = "0.1.0"
edition = "2021"
publish = false
description = "Mob Pit hood / borough / city tier aggregates (dev demo)"

[lib]
path = "src/lib.rs"

[dependencies]
distributed = { path = "../../../.." }
distributed_game = { path = "../../../../distributed_game" }
game_sim = { path = "../sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
distributed_game = { path = "../../../../distributed_game", features = ["cell"] }
