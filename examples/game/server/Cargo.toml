# Framework game demos: one binary, one subcommand per demo.
# Own workspace (like tests/gateway-native) so demo-only dependencies never
# reach the framework's lockfile; excluded from the root workspace.
[workspace]
members = [".", "sim", "crawler", "service"]
resolver = "2"

[package]
name = "game_demos"
version = "0.1.0"
edition = "2021"
publish = false
description = "Playable demos of the distributed_game authoritative runtime (dev only)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "game-demos"
path = "src/main.rs"

[dependencies]
# The client-predicted simulation (also compiled to WASM for the browser).
game_sim = { path = "sim" }
# The Crawler aggregate + RecordKill (shared with the read-model service).
mobpit_crawler = { path = "crawler" }
distributed_game = { path = "../../../distributed_game", features = ["net", "cell", "sqlite"] }
# Mob Pit: native durable SQLite cells + sorted-set leaderboards (Redis optional
# at runtime) + the SQLite bus for the read-model service.
distributed = { path = "../../..", features = ["cell-sqlite", "redis", "sqlite"] }
# The SQLite bus the cells' domain events are drained onto (`--projection-bus`).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }

[dev-dependencies]
distributed_game = { path = "../../../distributed_game", features = ["net", "cell", "bots"] }
tokio = { version = "1", features = ["process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
