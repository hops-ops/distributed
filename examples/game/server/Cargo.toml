# Framework game demos: one binary, one subcommand per demo.
# Own workspace (like tests/gateway-native) so demo-only dependencies never
# reach the framework's lockfile; excluded from the root workspace.
[workspace]
members = [".", "sim", "crawler", "rooms", "service"]
resolver = "2"

# `distributed build|dev examples/game/server` owns the SvelteKit demo's
# GraphQL client generation (`sveltekit/distributed.clients.json`).
[workspace.metadata.distributed.ui]
path = "../sveltekit"

[package]
name = "game_demos"
version = "0.1.0"
edition = "2021"
publish = false
description = "Playable demos of the distributed_game authoritative runtime (dev only)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "game-demos"
path = "src/main.rs"

[dependencies]
# The client-predicted simulation (also compiled to WASM for the browser).
game_sim = { path = "sim" }
# The Crawler aggregate + RecordKill (shared with the read-model service).
mobpit_crawler = { path = "crawler" }
# Mob Pit's room zone (hosted on celld; linked here for the client surface,
# tests and bots).
mobpit_rooms = { path = "rooms" }
distributed_game = { path = "../../../distributed_game", features = ["net", "cell", "celld"] }
# Mob Pit: sorted-set leaderboards (Redis optional at runtime), the SQLite
# projection bus and the modeled projector of the crawler directory
# (`graphql` gates modeled projections). Its durable cells run on celld
# (`examples/game/cells`), reached with `distributed_game`'s `celld` feature.
distributed = { path = "../../..", features = ["redis", "sqlite", "graphql"] }
# Reads of the celld cells over the internal path.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# The SQLite bus the cells' domain events are relayed onto (`--projection-bus`).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }

[dev-dependencies]
distributed_game = { path = "../../../distributed_game", features = ["net", "cell", "bots"] }
tokio = { version = "1", features = ["process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
