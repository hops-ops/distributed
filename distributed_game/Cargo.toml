[package]
name = "distributed_game"
description = "Authoritative multiplayer zone runtime for `distributed`: fixed-timestep zones, sequenced inputs, non-blocking durable facts, interest-managed binary replication and an optional WebSocket transport."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
default = []
# Tokio-driven fact worker (`spawn_fact_worker`). Core stays runtime-agnostic.
runtime = ["dep:tokio"]
# Adapter that commits facts into a `distributed` AggregateCell.
cell = ["dep:distributed", "dep:sha2", "dep:base64"]
# `celld::CelldFactSink`: a zone server's facts sent to celld cells over the
# internal HTTP path (routes by command; stable command ids; no local store).
celld = ["cell", "dep:reqwest", "dep:uuid"]
# celld worker glue (wasm32 Durable Objects): `world::zone_state::worker`,
# the zone-state HTTP surface over a cell and an R2 bucket binding.
workers-rs = ["cell", "dep:worker", "distributed/workers-rs"]
# Per-zone Prometheus metrics (dependency-free text exposition).
metrics = []
# Load-test bots (library + `game-bots` binary).
bots = ["net", "dep:tokio-tungstenite", "dep:futures-util", "tokio/rt-multi-thread"]
# axum WebSocket zone server with signed-ticket admission (+ /metrics).
net = ["runtime", "metrics", "dep:axum", "dep:hmac", "dep:sha2", "dep:base64", "tokio/net", "tokio/macros", "tokio/io-util"]
# `world::FencedLeaseOwnership`: zone ownership over `distributed::lease`.
lease = ["dep:distributed"]

[dependencies]
distributed_game_macros = { version = "0.1.0", path = "../distributed_game_macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"], optional = true }
distributed = { path = "..", default-features = false, optional = true }
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1"], optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.23", optional = true }
tokio-tungstenite = { version = "0.30", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
uuid = { version = "1", features = ["v7"], optional = true }
worker = { version = "0.8", optional = true }

[dev-dependencies]
base64 = "0.23"
trybuild = "=1.0.120"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "game-bots"
path = "src/bin/game-bots.rs"
required-features = ["bots"]

[[test]]
name = "netcode"
path = "tests/netcode/main.rs"
required-features = ["runtime"]

[[test]]
name = "bots"
path = "tests/bots/main.rs"
required-features = ["bots"]

[[test]]
name = "net_e2e"
path = "tests/net_e2e/main.rs"
required-features = ["net"]

[[test]]
name = "zone_lease"
path = "tests/zone_lease/main.rs"
required-features = ["cell"]

[[test]]
name = "zone_state"
path = "tests/zone_state/main.rs"
required-features = ["cell"]

[[test]]
name = "celld_zone_lease"
path = "tests/celld_zone_lease/main.rs"
required-features = ["celld", "runtime", "net"]

[[test]]
name = "celld_zone_state"
path = "tests/celld_zone_state/main.rs"
required-features = ["celld", "runtime"]

[[test]]
name = "celld_facts"
path = "tests/celld_facts/main.rs"
required-features = ["celld", "runtime"]

[[test]]
name = "inbox"
path = "tests/inbox/main.rs"
required-features = ["net"]

[[test]]
name = "lifecycle"
path = "tests/lifecycle/main.rs"
required-features = ["runtime"]

[[test]]
name = "cell_sink"
path = "tests/cell_sink/main.rs"
required-features = ["cell", "runtime"]

[[test]]
name = "world"
path = "tests/world/main.rs"
required-features = ["net", "lease", "celld"]

[[example]]
name = "echo_arena"
path = "examples/echo_arena.rs"
required-features = ["net"]
